name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'   # triggers on v1.0.0, v2.1.3, etc.
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    # runs-on: ${{ matrix.os }}
    # strategy:
    #     # Label OS Architecture
    #     # macos-13 macOS Ventura (13) Intel x86_64
    #     # macos-14 macOS Sonoma (14) Apple Silicon ARM64
    #     # macos-latest Latest stable (currently 15) ARM64
    #     # macos-15 macOS Sequoia (15) ARM64
    #     # macos-13 was deprecated and is being removed. 
    #     # GitHub announced that Intel-based macOS runners (macos-13 and older) are being phased out because Apple itself is moving away from Intel.
    #   matrix:
    #     os: [macos-14, macos-15]
    #     include:
    #       - os: macos-14
    #         arch: arm64
    #       - os: macos-15
    #         arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install OpenCV and Pkg-Config
        run: |
          brew install opencv pkg-config

      # go build -v -o auto-wechat-macos-${{ matrix.arch }} main.go
      - name: Build and Package macOS
        run: |
          # 1. Create a distribution folder
          mkdir -p dist
          
          # 2. Build the binary directly into that folder
          go build -v -o dist/auto-wechat-macos-arm64 main.go
          
          # 3. Copy resource folders
          # The -r flag copies directories recursively
          cp -r imgs dist/
          cp -r cfgs dist/
          
          echo "--- Content of MacOS dist ---"
          ls -R dist/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          # name: auto-wechat-macos-${{ matrix.arch }}
          # path: auto-wechat-macos-${{ matrix.arch }}
          name: auto-wechat-macos-arm64
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt6-base

      - name: Build Windows Binary
        shell: msys2 {0}
        run: |
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:$PKG_CONFIG_PATH
          
          # Set CGO flags so Go knows where to link OpenCV
          export CGO_CFLAGS=$(pkg-config --cflags opencv4)
          export CGO_CXXFLAGS=$(pkg-config --cflags opencv4)
          export CGO_LDFLAGS=$(pkg-config --libs opencv4)
          
          # Build: -s -w removes debug symbols to reduce size
          go build -tags customenv -v -ldflags="-s -w" -o auto-wechat-windows.exe main.go

      - name: Collect Dependencies (Smart Mode)
        shell: msys2 {0}
        run: |
          mkdir -p dist
          mv auto-wechat-windows.exe dist/

          echo "--- 1. Copying Linked DLLs (ldd) ---"
          # Detects direct dependencies (Qt6Core, OpenCV, etc.)
          ldd dist/auto-wechat-windows.exe | grep '/mingw64/' | awk '{print $3}' | sort | uniq | while read -r dll; do
            echo "Copying $dll"
            cp "$dll" dist/
          done

          echo "--- 2. Copying Required Qt Plugins ---"
          # Qt Windows Platform Plugin (Required for GUI)
          mkdir -p dist/platforms
          cp /mingw64/share/qt6/plugins/platforms/qwindows.dll dist/platforms/
          
          # Check dependencies of qwindows.dll
          ldd dist/platforms/qwindows.dll | grep '/mingw64/' | awk '{print $3}' | sort | uniq | while read -r dll; do
             if [ ! -f "dist/$(basename $dll)" ]; then
                echo "Copying extra Qt dep: $dll"
                cp "$dll" dist/
             fi
          done

          echo "--- 2.1 Copying Runtime Loaded DLLs (Vulkan) ---"
          # Qt6 uses Vulkan for rendering but loads it at runtime, so ldd misses it.
          if [ -f "/mingw64/bin/vulkan-1.dll" ]; then
             echo "Copying vulkan-1.dll"
             cp /mingw64/bin/vulkan-1.dll dist/
          else
             echo "Warning: vulkan-1.dll not found, app might crash on some systems."
          fi

          echo "--- 3. Copying Resources (imgs/cfgs) ---"
          cp -r imgs dist/
          cp -r cfgs dist/

          echo "--- 4. Reducing Size (Stripping Symbols) ---"
          strip dist/*.exe
          strip dist/*.dll
          strip dist/platforms/*.dll || true

          echo "--- Final Content ---"
          ls -R dist/

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-wechat-windows
          path: dist/

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # The GITHUB_TOKEN only has read permissions — but creating a release requires write access to Contents.
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Releases
        run: |
          # 1. Package Windows
          # Create a nice internal folder structure for the zip
          mkdir -p package_win/auto-wechat-windows
          # Copy artifact content (exe, dlls, imgs, cfgs) into that folder
          cp -r artifacts/auto-wechat-windows/* package_win/auto-wechat-windows/
          # Zip it
          cd package_win
          zip -r ../auto-wechat-windows.zip auto-wechat-windows
          cd ..

          # 2. Package macOS
          mkdir -p package_mac/auto-wechat-macos
          # Copy artifact content (binary, imgs, cfgs)
          cp -r artifacts/auto-wechat-macos-arm64/* package_mac/auto-wechat-macos/
          # Ensure binary is executable
          chmod +x package_mac/auto-wechat-macos/auto-wechat-macos-arm64
          # Zip it
          cd package_mac
          zip -r ../auto-wechat-macos-arm64.zip auto-wechat-macos
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            auto-wechat-macos-arm64.zip
            auto-wechat-windows.zip
          generate_release_notes: true
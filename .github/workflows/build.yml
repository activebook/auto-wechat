name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    # runs-on: ${{ matrix.os }}
    # strategy:
    #     # Label OS Architecture
    #     # macos-13 macOS Ventura (13) Intel x86_64
    #     # macos-14 macOS Sonoma (14) Apple Silicon ARM64
    #     # macos-latest Latest stable (currently 15) ARM64
    #     # macos-15 macOS Sequoia (15) ARM64
    #     # macos-13 was deprecated and is being removed. 
    #     # GitHub announced that Intel-based macOS runners (macos-13 and older) are being phased out because Apple itself is moving away from Intel.
    #   matrix:
    #     os: [macos-14, macos-15]
    #     include:
    #       - os: macos-14
    #         arch: arm64
    #       - os: macos-15
    #         arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install OpenCV and Pkg-Config
        run: |
          brew install opencv pkg-config

      - name: Build macOS Binary
        run: go build -v -o auto-wechat-macos-arm64 main.go
          # go build -v -o auto-wechat-macos-${{ matrix.arch }} main.go

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          # name: auto-wechat-macos-${{ matrix.arch }}
          # path: auto-wechat-macos-${{ matrix.arch }}
          name: auto-wechat-macos-arm64
          path: auto-wechat-macos-arm64

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt6-base

      - name: Verify OpenCV Installation
        shell: msys2 {0}
        run: |
          pkg-config --cflags --libs opencv4
          ls -la /mingw64/include/opencv4/opencv2/ || echo "OpenCV2 headers not found in /mingw64/include/opencv4/opencv2/"

      - name: Build Windows Binary
        shell: msys2 {0}
        run: |
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:$PKG_CONFIG_PATH
          export CPATH=/mingw64/include/opencv4:/mingw64/include:$CPATH
          export LIBRARY_PATH=/mingw64/lib:$LIBRARY_PATH
          export CGO_CFLAGS="$(pkg-config --cflags opencv4)"
          export CGO_CXXFLAGS="$(pkg-config --cflags opencv4)"
          export CGO_LDFLAGS="$(pkg-config --libs opencv4)"
          go build -tags customenv -v -o auto-wechat-windows.exe main.go

      - name: Collect Windows DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp auto-wechat-windows.exe dist/

          # Use pacman's own dependency graph — authoritative, never misses a DLL.
          # pactree lists all transitive runtime deps of opencv; pacman -Ql lists
          # every file owned by those packages; we grab the .dll ones from /mingw64/bin/.
          pactree -u mingw-w64-x86_64-opencv \
            | xargs pacman -Ql \
            | awk '/\/mingw64\/bin\/.*\.dll$/ { print $2 }' \
            | xargs -I{} cp -n "{}" dist/

          echo "--- DLLs collected ---"
          ls dist/

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-wechat-windows
          path: dist/

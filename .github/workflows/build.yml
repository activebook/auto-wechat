name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    # runs-on: ${{ matrix.os }}
    # strategy:
    #     # Label OS Architecture
    #     # macos-13 macOS Ventura (13) Intel x86_64
    #     # macos-14 macOS Sonoma (14) Apple Silicon ARM64
    #     # macos-latest Latest stable (currently 15) ARM64
    #     # macos-15 macOS Sequoia (15) ARM64
    #     # macos-13 was deprecated and is being removed. 
    #     # GitHub announced that Intel-based macOS runners (macos-13 and older) are being phased out because Apple itself is moving away from Intel.
    #   matrix:
    #     os: [macos-14, macos-15]
    #     include:
    #       - os: macos-14
    #         arch: arm64
    #       - os: macos-15
    #         arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install OpenCV and Pkg-Config
        run: |
          brew install opencv pkg-config

      - name: Build macOS Binary
        run: go build -v -o auto-wechat-macos-arm64 main.go
          # go build -v -o auto-wechat-macos-${{ matrix.arch }} main.go

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          # name: auto-wechat-macos-${{ matrix.arch }}
          # path: auto-wechat-macos-${{ matrix.arch }}
          name: auto-wechat-macos-arm64
          path: auto-wechat-macos-arm64

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt6-base

      - name: Build Windows Binary
        shell: msys2 {0}
        run: |
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:$PKG_CONFIG_PATH
          
          # --- FIX 1: Explicitly set CGO flags via pkg-config ---
          # This was missing in the failing build. It tells the linker which .dll/.a files to use.
          export CGO_CFLAGS=$(pkg-config --cflags opencv4)
          export CGO_CXXFLAGS=$(pkg-config --cflags opencv4)
          export CGO_LDFLAGS=$(pkg-config --libs opencv4)
          
          echo "Building with flags: $CGO_LDFLAGS"
          
          # -s -w removes debug symbols from the Go binary itself
          go build -tags customenv -v -ldflags="-s -w" -o auto-wechat-windows.exe main.go

      - name: Collect Dependencies (Smart Mode)
        shell: msys2 {0}
        run: |
          mkdir -p dist
          mv auto-wechat-windows.exe dist/

          echo "--- 1. Copying Linked DLLs (Automated) ---"
          # 'ldd' lists the dynamic dependencies. We filter for files in /mingw64/ 
          # to avoid system files, and copy them to the dist folder.
          # This automatically grabs standard Qt dlls (Qt6Core, Qt6Gui, etc.)
          ldd dist/auto-wechat-windows.exe | grep '/mingw64/' | awk '{print $3}' | sort | uniq | while read -r dll; do
            echo "Copying $dll"
            cp "$dll" dist/
          done

          echo "--- 2. Copying Required Qt Plugins ---"
          # Qt apps fail to open without the 'platforms/qwindows.dll' plugin.
          # It is loaded at runtime, so ldd misses it. We copy it manually.
          mkdir -p dist/platforms
          cp /mingw64/share/qt6/plugins/platforms/qwindows.dll dist/platforms/
          
          # We also need to copy dependencies of qwindows.dll itself (it might need extra libs)
          ldd dist/platforms/qwindows.dll | grep '/mingw64/' | awk '{print $3}' | sort | uniq | while read -r dll; do
             # Only copy if we don't have it yet to avoid overwrite warnings
             if [ ! -f "dist/$(basename $dll)" ]; then
                echo "Copying extra Qt dep: $dll"
                cp "$dll" dist/
             fi
          done

          echo "--- 3. Reducing Size (Stripping Symbols) ---"
          # MSYS2 DLLs have heavy debug symbols. Stripping them reduces size by ~50%.
          strip dist/*.exe
          strip dist/*.dll
          strip dist/platforms/*.dll || true

          echo "--- Final Content ---"
          ls -R dist/

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-wechat-windows
          path: dist/

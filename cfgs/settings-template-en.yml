    margin_y: 14
    w: 80
    h: 28

# -- Below are the settings for auto-wechat --
# -- User must set by themselves --
# -- Used in auto-wechat proc and auto-wechat clear --
# Application title to activate
app_title: WeChat
# Max count of messages to send
max_count: 6
# Interval between messages sent (ms) [100 - 500]
interval: 100
# Whether to check the last contact is the end of contacts list
check_end: true
# Whether to send message automatically
auto_send: true
# Whether to use fast mode (skip wait for messages popup and messages bar shown up)
fast_mode: false
# Debug mode (show debug message, very slow)
debug: false
